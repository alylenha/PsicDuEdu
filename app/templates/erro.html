{% extends "base.html" %}
{% block title %}Erro {{ codigo }}{% endblock %}
{% block cabecalho %}Ops…{% endblock %}
{% block conteudo %}
<div class="card card-bloqueio">
  <div class="cadeado-grande">{{ '🔒' if codigo == 403 else ('🧭' if codigo == 404 else '⚠️') }}</div>
  <h2>Erro {{ codigo }}</h2>
  <p>{{ mensagem }}</p>
  <a class="btn btn-primario" href="{{ url_for('dashboard.index') }}">← Voltar ao Dashboard</a>
</div>
{% endblock %}
